name: plan_zajec_uek
description: Niezbędnik Studenta - plan zajęć, obecności i dojazdy na uczelnię.
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Network
  http: ^1.2.1
  cookie_jar: ^4.0.9

  # HTML parsing
  html: ^0.15.4

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Background tasks
  workmanager: ^0.9.0+3

  # Crypto for change detection hashing
  crypto: ^3.0.3

  # Date formatting
  intl: ^0.19.0
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  webview_flutter_platform_interface: ^2.15.1
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
